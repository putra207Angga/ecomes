name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Build Jaspr web app
        run: dart run jaspr:jaspr build

      - name: Copy akun.json ke build output
        run: |
          # Buat akun.json default jika tidak ada (CI environment)
          if [ ! -f "web/akun.json" ]; then
            echo '{"accounts":[{"name":"Admin","email":"admin@ecomes.com","password":"admin123","role":"Super Admin","avatar":"https://picsum.photos/seed/admin/100/100"}]}' > build/jaspr/web/akun.json
          else
            cp web/akun.json build/jaspr/web/akun.json
          fi

      - name: Deploy ke gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/jaspr/web
          publish_branch: gh-pages
          force_orphan: true
