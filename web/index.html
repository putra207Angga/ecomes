    <!-- Leaflet Indonesia Map Initialization Script -->
    <script>
      function initIndonesiaMap() {
        var container = document.getElementById('indonesia-map');
        if (!container) return;
        if (container._leaflet_id) return; // already initialized

        var map = L.map('indonesia-map', {
          center: [-2.5, 118.0],
          zoom: 5,
          maxZoom: 19,
          minZoom: 4,
          zoomControl: true
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        var zoomBadge = document.getElementById('map-zoom-level-badge');
        var zoomName = document.getElementById('map-zoom-name');

        function updateZoomInfo() {
          var z = map.getZoom();
          var label = '🇮🇩 Indonesia Overview (Nasional)';
          if (z >= 16) {
            label = '🏘️ Tingkat Kelurahan / Jalan Detail';
          } else if (z >= 13) {
            label = '🏡 Tingkat Kecamatan / Desa';
          } else if (z >= 10) {
            label = '🏙️ Tingkat Kabupaten / Kota';
          } else if (z >= 7) {
            label = '📍 Tingkat Provinsi';
          }
          if (zoomBadge) zoomBadge.textContent = 'Zoom: ' + z;
          if (zoomName) zoomName.textContent = label;
        }

        map.on('zoomend', updateZoomInfo);
        updateZoomInfo();

        var hubs = [
          { name: 'Hub Utama Jakarta Pusat', lat: -6.2088, lng: 106.8456, orders: '45,210 Pengiriman', status: 'Sangat Padat 🔴' },
          { name: 'Hub Surabaya (Jawa Timur)', lat: -7.2575, lng: 112.7521, orders: '28,400 Pengiriman', status: 'Lancar 🟢' },
          { name: 'Hub Bandung (Jawa Barat)', lat: -6.9175, lng: 107.6191, orders: '18,900 Pengiriman', status: 'Padat 🟡' },
          { name: 'Hub Medan (Sumatra Utara)', lat: 3.5952, lng: 98.6722, orders: '14,200 Pengiriman', status: 'Lancar 🟢' },
          { name: 'Hub Makassar (Sulawesi)', lat: -5.1477, lng: 119.4327, orders: '9,800 Pengiriman', status: 'Lancar 🟢' },
          { name: 'Hub Denpasar (Bali)', lat: -8.6705, lng: 115.2126, orders: '12,500 Pengiriman', status: 'Lancar 🟢' },
          { name: 'Hub Semarang (Jawa Tengah)', lat: -6.9667, lng: 110.4167, orders: '16,300 Pengiriman', status: 'Lancar 🟢' },
          { name: 'Hub Palembang (Sumatra Selatan)', lat: -2.9761, lng: 104.7754, orders: '8,700 Pengiriman', status: 'Lancar 🟢' }
        ];

        hubs.forEach(function(h) {
          var marker = L.marker([h.lat, h.lng]).addTo(map);
          marker.bindPopup(
            '<div style="padding: 4px;">' +
            '<strong style="color: #0d6efd; font-size: 14px;">📦 ' + h.name + '</strong><br>' +
            '<span style="font-size: 12px; color: #555;">Total: <b>' + h.orders + '</b></span><br>' +
            '<span style="font-size: 11px; color: #777;">Status Hub: ' + h.status + '</span><br>' +
            '<button onclick="window.zoomToHub(' + h.lat + ',' + h.lng + ', 15)" style="margin-top:6px; background:#0d6efd; color:#fff; border:none; padding:4px 10px; border-radius:4px; font-size:11px; cursor:pointer;">Zoom ke Kelurahan / Kecamatan</button>' +
            '</div>'
          );
        });

        window.mapInstance = map;
        window.zoomToHub = function(lat, lng, zoom) {
          map.flyTo([lat, lng], zoom || 15, { duration: 1.5 });
        };

        window.flyToRegion = function(lat, lng, zoom) {
          map.flyTo([lat, lng], zoom, { duration: 1.5 });
        };
      }

      document.addEventListener('DOMContentLoaded', function() {
        initIndonesiaMap();
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('sw.js');
        });
      }
    </script>
